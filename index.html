<!DOCTYPE html>
<html ng-app="gratitudeApp">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="Make Gratitude an everyday practice. A simple, daily use app that keeps your notes personal">
    <title>Gratitude rocks! >> Anila Damodhar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css?ts=300415">
    <link rel="author" href="/humans.txt">
</head>

<body ng-controller="gratitudeApp.controller">
<section class="curtain" ng-show="newvisitor">
    <div class="container">
        <img src="https://img.icons8.com/?size=125&id=46591&format=png" alt="illustration">
        <h2>Gratitude rocks!</h2>
        <p>Gratitude is life transforming when you make it a daily practice</p>
        <div class=" button btn-close" ng-click="newvisitor=false">Start!</div>
    </div>
</section>
<section id="notes" ng-class="{'new-visitor':newvisitor==true}">
    <h1>My gratitude notes</h1>
    <ul>
    <li ng-repeat="notes in journal track by $index">
        <a href="#">
        <span ng-click="removeNote(notes.note, $index)" style="float:right; color:maroon;" title="Delete this note">&#10006;
        </span>
        <h2>
            {{notes.date | date:'fullDate'}}
        </h2>
        <p>{{notes.note}}</p>
        </a>
    </li>
    </ul>
<div class="editor">
    <div class="compose">
        <button id="addbtn">
            <div id="in22" class="btn"></div>
        </button>
    </div>
    <div id="box">
        <form id="createForm" name="createForm" ng-submit="addMore()" novalidate>   
            <label for="newNote"><b>Quick tip. </b>Start with - <br/>"I am so grateful and happy that..."</label>
            <div contenteditable="true" name="newNote" id="inptarea" [(ngModel)]="textField" ngDefaultControl tabIndex="1"></div>
            <input type="submit" id="inpbutton" value="Stick it" ng-disabled="createForm.newNote.$invalid">
            <input type="button" id="resbutton" value="Discard">
        </form>
    </div>
</div>
</section>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular-resource.min.js"></script>
    <script src="scripts/app.js"></script>
    <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

        ga('create', 'UA-45068103-1', 'auto');
        ga('send', 'pageview');
    </script>

</body>

</html>
